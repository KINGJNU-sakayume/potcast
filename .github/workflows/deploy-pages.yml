name: Deploy ARC Music to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test, and build
        run: npm run check
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URI: ${{ vars.VITE_SPOTIFY_REDIRECT_URI }}
          VITE_LYRICS_PROVIDER: ${{ vars.VITE_LYRICS_PROVIDER }}
          VITE_TRANSLATION_PROVIDER: ${{ vars.VITE_TRANSLATION_PROVIDER }}
          VITE_TRANSLATION_ENDPOINT: ${{ vars.VITE_TRANSLATION_ENDPOINT }}
          VITE_TRANSLATION_TARGET: ${{ vars.VITE_TRANSLATION_TARGET }}
          VITE_ENABLE_PREVIEW: ${{ vars.VITE_ENABLE_PREVIEW }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
