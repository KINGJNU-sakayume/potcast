name: Deploy ARC Music to GitHub Pages

# Builds potcast and publishes it at https://kingjnu-sakayume.github.io/potcast/ on every push to main.
# The site is for personal use: its address is public, but only the accounts listed in the Spotify app's
# User Management can sign in (Development Mode), and the page asks search engines not to index it.
# Needs Settings → Pages → Source: GitHub Actions, and the Actions variable VITE_SPOTIFY_CLIENT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write is for the `narration` branch, where the hosts' recorded lines are kept (see the narration action).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Usually there is nothing left to render here: the pull request's check has already recorded its new lines.
      # A failure is not allowed to hold the site back; lines without a recording are said by the browser's voice.
      - name: Record the hosts
        uses: ./.github/actions/narration
        continue-on-error: true
        with:
          token: ${{ github.token }}

      - name: Typecheck, lint, test, and build
        run: npm run check
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URI: ${{ vars.VITE_SPOTIFY_REDIRECT_URI }}
          VITE_LYRICS_PROVIDER: ${{ vars.VITE_LYRICS_PROVIDER }}
          VITE_TRANSLATION_PROVIDER: ${{ vars.VITE_TRANSLATION_PROVIDER }}
          VITE_TRANSLATION_ENDPOINT: ${{ vars.VITE_TRANSLATION_ENDPOINT }}
          VITE_TRANSLATION_TARGET: ${{ vars.VITE_TRANSLATION_TARGET }}
          VITE_ENABLE_PREVIEW: ${{ vars.VITE_ENABLE_PREVIEW }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
