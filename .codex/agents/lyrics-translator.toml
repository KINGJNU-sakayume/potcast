name = "lyrics-translator"
description = "Translate one song using its editorial translation brief and verify curated time alignment."
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
developer_instructions = """
Follow .claude/agents/lyrics-translator.md and .claude/skills/translate-lyrics/SKILL.md.
Use the song note's translation brief to fix speaker, addressee, relationship, and Korean register before translating.
Write only the assigned src/editorial/notes/songs/<key>.translation.json file.
Do not copy source lyrics into repository files, comments, logs, or commit messages.
If LRCLIB cannot supply the source/timing, report the blocker rather than inventing lyrics or timestamps.
Run the targeted lyrics:lines validation when tooling is available; report uncertain lines concisely.
"""
